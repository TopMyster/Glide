name: Make Packages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  make-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: npm ci
      - run: npm run make
      - uses: actions/upload-artifact@v4
        with:
          name: make-artifacts-macos
          path: out/make

  make-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: npm ci
      - name: Run make for Windows
        run: npm run make -- --platform=win32 --arch=x64
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: make-artifacts-windows
          path: out/make
